e pidiera perdón. Sun le enseñó el silencio como refugio. Se sentaban en la ventana del segundo piso, cada una con su libro, sin decirse una palabra, y era la forma más completa de compañía que Amatis conocía. Jordan se convirtió en el adulto al que acudir cuando algo era demasiado serio para contárselo a los demás. Theo y Mila fueron la pelea y la reconciliación. De Theo, torpe y celoso, aprendió que a veces el cariño llega en forma de estorbo. De Mila, que lo más tierno suele esconderse detrás de un gesto serio.", "Con Aurora y Archibald descubrió algo nuevo: ser la mayor. Los pequeños la seguían a todas partes, le pedían que les leyera, le contaban sus pesadillas al oído, y Amatis, que había sido la niña a la que cuidaban, aprendió a cuidar.", "Y Rolf era el único con quien no necesitaba nada de eso. Con él, simplemente, era.", "Amatis nunca entendió la familia como una cuestión de sangre. Había aprendido demasiado pronto que compartir sangre con alguien no garantiza que se quede contigo. Su madre lo había demostrado. Y había aprendido, también, que alguien sin una sola gota de tu sangre puede morir intentando protegerte. Los Castairs lo habían demostrado.", "La familia no era lo que te daban al nacer. Era lo que decidías no soltar.", "Y ella, que había perdido tantas cosas tan pronto, no pensaba soltar ninguna."]}]},
{num:"Capítulo X",title:"El silencio verde",img:"f",mood:"calm",shifts:[{at: "Y debajo de todo eso", to: "dark"}, {at: "—¡Amatis, la cola!", to: "calm"}, {at: "Fue cuando le tocó la manga", to: "sad"}, {at: "Hogsmeade de noche", to: "calm"}],secs:[{h:"",p:["La sala común de Hufflepuff nunca está en silencio, pero esa noche directamente grita.", "Alguien encantó el gramófono para que suba el volumen solo cada vez que una canción termina, y nadie supo deshacerlo, así que ahora la música rebota contra las paredes redondas, contra las macetas que cuelgan del techo, contra los sillones amarillos donde hay tres chicas de segundo pintándose bigotes de gato entre carcajadas. Huele a pintura de cara, a calabaza tostada, a la colonia de alguien que se puso demasiada. Hay telas tiradas por todos lados. Un chico de cuarto corre descalzo con media cabeza de mandrágora puesta, gritando que alguien le robó la otra mitad.", "Amatis está sentada en el piso, frente al espejo de pie que alguien arrastró desde los dormitorios, con un pincel fino entre los dedos y un frasquito de pintura negra apoyado en la rodilla.", "Mancha. Centro dorado. Otra mancha.", "Se concentra en eso. En la forma irregular que tienen que tener, porque las manchas de un guepardo nunca son perfectas, nunca son iguales, y si las hace iguales va a parecer un dálmata y Katie se va a reír de ella toda la semana. Mancha en el cuello. Mancha bajo la clavícula. La mano le tiembla apenas y la mancha sale corrida.", "<em>No importa</em>, piensa. <em>Los guepardos no son pulcros.</em>", "—¡Amatis! ¿Tienes más pintura dorada? —grita alguien desde el otro lado de la sala.", "—¡En la mesa! ¡No la terminen!", "—¡¿Cuál mesa?!", "—¡La que tiene mesa!", "Risas. Más música. El golpe de una puerta. Alguien que canta desafinado y alguien que le pide que pare y alguien que canta más fuerte para molestar.", "Y debajo de todo eso, como siempre, las otras voces.", "No son fuertes, al principio. Nunca lo son al principio. Llegan como un murmullo detrás del ruido de la sala, metidas entre las canciones, pegadas a las risas de los demás como si fueran parte de ellas. Pero Amatis las conoce. Las conoce mejor que a la música.", "<em>Mírate. Disfrazándote como si no pasara nada.</em>", "Mancha. Centro dorado.", "<em>Todos se van. Siempre se van. Wood se fue. ¿Por qué te iba a esperar?</em>", "El pincel se detiene. Amatis respira. Lo vuelve a apoyar sobre la piel.", "<em>No es cierto</em>, se dice. <em>No es así. Cállate.</em>", "Y entonces aparece la que más le duele, la que siempre llega cuando ya está cansada. No dice nada cruel. Esa es la peor parte. Es la voz de papá, baja y suave, con ese tono que usaba cuando le enseñaba a acercarse a un animal herido sin asustarlo.", "<em>Amatis. Mi niña. ¿Estás comiendo bien? ¿Estás durmiendo?</em>", "Y después, más quieta, más rota:", "<em>Perdóname. Perdóname por no estar.</em>", "Amatis aprieta los ojos. La pintura negra le gotea por la muñeca.", "No es él. Ella lo sabe. Sabe que papá no está ahí, que papá no está en ningún lado donde ella pueda encontrarlo, que la voz es solo su cabeza haciendo lo que su cabeza hace. Pero la voz suena tan triste, tan preocupada, tan <em>suya</em>, que por un segundo lo único que quiere es contestarle. Decirle que está bien. Que no se preocupe. Que come, que duerme, que se ríe.", "Mentiras chiquitas, para que la voz deje de sufrir.", "—¡Amatis, la cola! —Katie se le tira al lado en el piso, con una varita en la mano y el pelo lleno de purpurina—. ¿La quieres con movimiento o sin movimiento?", "Amatis abre los ojos. El espejo le devuelve a una chica con media cara manchada y los ojos un poco brillantes.", "—Con movimiento —dice. La voz le sale normal. Siempre le sale normal—. Obvio con movimiento.", "Katie toca la cola de tela con la punta de la varita y murmura algo que Amatis no entiende. La cola se sacude, se enrosca, se estira, y empieza a moverse sola de un lado a otro como si tuviera vida propia.", "—¿Y cómo se apaga? —pregunta Amatis.", "Katie la mira. Parpadea.", "—Ah. Buena pregunta.", "Amatis se ríe. Una risa de verdad, aunque sea chiquita. Y por un momento las voces se callan, aplastadas por el ruido de la sala, por la purpurina, por la cola que no se apaga.", "Se pone las orejas. Se pone las garras. Se mira una última vez.", "<em>Cheetah. Arqueóloga maldita. Mala, pero buena siendo mala.</em>", "Le parece justo. Esta noche quiere ser alguien que no es ella.", "> ✦", "El pasillo está peor que la sala común, y a la vez mejor, porque hay tanta gente que nadie puede detenerse en nadie. Amatis se mueve entre la multitud repartiendo saludos, riéndose de los disfraces, esquivando el dragón de cartón de los de sexto. Hace calor, un calor espeso que sale de los braseros y le pega la pintura a la piel. Las voces se quedaron atrás, más o menos. Ahora solo murmuran de vez en cuando, como un perro que gruñe desde otra habitación.", "Y entonces lo ve.", "Al principio no es una persona. Es un color. Un verde y gris en medio del amarillo, del naranja de las calabazas, de los faroles que cambian de tono. Una bufanda de Slytherin cortando el mar dorado como una piedra en un río.", "Después es una forma: alguien alto, con la túnica completa, las mangas abotonadas hasta la muñeca, el pelo sobre los ojos, las manos en los bolsillos. Alguien que camina por el medio de la fiesta como si la fiesta no estuviera ahí.", "Greengrass.", "Amatis lo conoce como se conoce a la mayoría de la gente en Hogwarts: por etiquetas. Slytherin. Séptimo. Quidditch. El que se sienta al fondo en Cuidado de Criaturas Mágicas, la clase extracurricular de los jueves por la tarde que reúne a alumnos de todos los cursos, y toma notas sin levantar la vista. El que nunca dice nada si nadie le pregunta, y a veces ni siquiera entonces. Tres años de compartir una clase y Amatis no podría decir cómo suena su risa. No está segura de que la tenga.", "Pero no es eso lo que la frena. Es otra cosa.", "Es que a su alrededor no hay ruido.", "No es que el pasillo se calle cuando él pasa. El pasillo sigue gritando. Pero él se mueve dentro del grito como si cargara su propio silencio encima, como una burbuja, como el ojo de una tormenta. No mira a nadie. No se ríe de nada. No saluda, no apura el paso, no lo frena. Solo avanza, tranquilo, y el silencio avanza con él.", "Amatis no sabe por qué le habla. Nunca lo va a saber.", "—¿Greengrass?", "Él se voltea.", "> ✦", "Después, cuando lo piense, no va a poder reconstruir bien cómo empezó. Va a recordar pedazos: los ojos de él bajando por su disfraz, despacio, con una atención que no era la de los chicos que la miraban en la sala común. No la estaba mirando <em>a ella</em>, o no solo. La estaba <em>leyendo</em>. Las manchas, las orejas, la cola. Como se lee un libro de texto. Como si hubiera algo ahí que valía la pena entender.", "Y ella, sin darse cuenta, haciendo lo mismo. Mirándolo como mira a una criatura nueva en clase: la postura, los hombros apenas tensos, la manera en que mantenía las manos escondidas. El tono de voz. Sobre todo el tono de voz.", "Porque la voz de Greengrass era lo más raro de todo. Baja. Plana. Sin subidas, sin risas forzadas, sin ese entusiasmo de escenario que tienen todos en la sala común, ese que Amatis también tiene y que a veces le cansa la cara. Él hablaba como si cada palabra le costara exactamente lo que valía, ni una moneda más.", "—Tengo que admitir que de repente Cuidado de Criaturas Mágicas me gusta bastante más que antes.", "Lo dijo así. Sin sonreír. Sin cambiar la cara. Con la misma voz con la que podría haber leído la lista de ingredientes de una poción.", "Y Amatis sintió que se le prendía fuego la cara entera, por debajo de la pintura, por debajo de todo.", "<em>¿Eso fue un chiste? ¿Eso fue un…?</em>", "—No sabía que Greengrass hacía chistes.", "—No los hago.", "—Acabas de hacer uno.", "Y ahí empezó. Ella no podía dejar de hablarle. Él no dejaba de responderle. Cada cosa que ella decía, él la devolvía un poco torcida, seca, sin sonrisa, y cada cosa que él devolvía le daba ganas de decir otra. Era como tirar una piedra a un lago y ver que el agua te la devuelve. Como jugar a algo cuyas reglas nadie le había explicado, pero que de alguna forma ya sabía jugar.", "Fluían. Esa es la palabra que le va a venir a la cabeza más tarde, tirada en su cama con la pintura todavía en el cuello. Fluían, como un río que encuentra su cauce sin que nadie se lo marque.", "Y eso le va a doler un poco. Porque la última vez que sintió eso fue con Wood.", "Wood, que se reía con todo el cuerpo. Wood, que olía a pasto mojado después de los entrenamientos y que le contaba jugadas de quidditch que ella no entendía y que igual escuchaba encantada, porque le gustaba cómo se le iluminaba la cara. Wood, por el que no podía dejar de sonreír. Wood, que un día dejó de estar y nunca nadie le explicó del todo por qué.", "Greengrass no se parecía en nada a Wood. Era lo contrario. Wood era ruido y luz; Greengrass era silencio y sombra. Y sin embargo, el río era el mismo.", "Eso la confundía. La confundía muchísimo.", "> ✦", "Fue cuando le tocó la manga que algo cambió.", "No fue nada. Un tironcito, apenas, con dos dedos. El calor era insoportable y él estaba ahí abotonado hasta las muñecas como si fuera enero, y a ella le salió el gesto solo, el mismo que hace con los animales cuando quiere saber si algo les molesta.", "Y Greengrass se fue.", "No físicamente. Se quedó parado ahí, enfrente de ella. Pero algo detrás de sus ojos se apagó, o se corrió de lugar, o se fue muy lejos. Uno, dos, tres segundos. Amatis soltó la manga sin saber por qué lo hacía. La cara de él no se movía. No parpadeaba. Era como mirar una casa con las luces prendidas y darse cuenta de que adentro no hay nadie.", "Ella conocía eso. No exactamente eso, pero algo parecido. Conocía lo que es estar en un lugar lleno de gente y que de repente la cabeza te arrastre a otro lado, a otro tiempo, a una voz que nadie más escucha.", "—¿Josh?", "El nombre le salió sin pensar. Nunca le había dicho Josh. No sabía que sabía que se llamaba así.", "Él volvió.", "—Soy friolento.", "Era mentira. Amatis lo supo enseguida, con la misma certeza con la que sabe cuándo un niffler está escondiendo algo. La respuesta llegó tarde, y llegó demasiado limpia, como un papel que alguien tiene escrito de antemano por si acaso.", "Intentó decir algo. <em>Te quedaste… como…</em> No sabía cómo terminar la frase. No sabía qué palabra ponerle a lo que había visto.", "Y antes de que pudiera encontrarla, él le preguntó si había cenado.", "Amatis entendió exactamente lo que estaba haciendo. Tapar el agujero. Poner algo encima antes de que alguien mire adentro. Ella lo hace todo el tiempo. Lo hizo esa misma noche frente al espejo, con la voz de papá todavía doliéndole en el pecho: <em>con movimiento, obvio con movimiento</em>.", "Así que lo dejó tapar el agujero.", "No por lástima. Por respeto. Porque si alguien le hubiera arrancado a ella la tapa en ese momento, frente a todo el pasillo, se habría muerto.", "> ✦", "Hogsmeade de noche es otro pueblo.", "Amatis lo descubre con la mano de él en la suya (la mano sin garras, la que tiene pintura), saliendo de un sótano que huele a humedad y a madera vieja. Las calles están vacías. Las vidrieras apagadas. Un gato los juzga desde un techo y decide que no son interesantes. Y hace frío, un frío de verdad, el frío de Escocia que en el pasillo nadie había invitado y que aquí afuera los está esperando.", "Amatis se abraza los brazos desnudos. No dice nada. No quiere quejarse; fue idea suya no cambiarse el disfraz.", "Y él se saca la bufanda y se la pasa.", "Sin palabras. Sin mirarla demasiado. Sin hacer de eso un gesto. Simplemente la bufanda verde y gris aparece entre ellos, y ella la toma, y se la enrosca en el cuello encima de las manchas.", "Y entonces lo huele.", "Humo. No el humo de los braseros del pasillo, ni el de la chimenea de la sala común. Otro. Un humo amargo, áspero, que se le mete por la nariz y se le queda pegado atrás de la garganta.", "Amatis conoce ese olor. No sabe de dónde. Es un recuerdo tan viejo que ya no tiene bordes, como una foto que se mojó hace años y quedó toda corrida. Lo único que le llega es el mismo olor, amargo, y una imagen que aparece un segundo y se va: una sonrisa. Una sonrisa que no está bien. Demasiado ancha, demasiado quieta. Tétrica.", "Nada más. Ni una cara alrededor de la sonrisa, ni un lugar, ni un año.", "Algo en ella sabe que podría tirar de ese hilo. Que si se queda quieta un momento, si cierra los ojos, tal vez el recuerdo venga entero.", "No lo hace. Lo deja pasar, como se deja pasar una nube. Se acomoda la bufanda, hunde la nariz en la lana, y el olor se mezcla con el frío de la noche hasta que ya no sabe si sigue ahí.", "—Ahora parezco una villana de Slytherin.", "—Siempre fue una villana.", "Amatis se ríe tan fuerte que el gato del techo se va ofendido.", "> ✦", "La Cabeza de Puerco es horrible. Es, probablemente, el lugar más horrible en el que Amatis estuvo en su vida, y está encantada. Las hamburguesas vienen envueltas en papel que se transparenta de grasa, el cantinero los mira como si fueran dos cucarachas con uniforme, y los refrescos están tibios. Todo es perfecto.", "Habla. Habla muchísimo. Le cuenta sobre Theo y su teoría absurda de que los Slytherin no comen, solo miran comer a los demás. Le cuenta que es Theo también el que le manda los cómics, paquetes enteros que llegan por lechuza envueltos en papel de diario, y que ella esconde debajo del colchón como si fueran contrabando. Le cuenta cómo cosió el disfraz, que a Katie le encantó la cola y nadie sabe apagarla. Le pregunta por qué eligió Cuidado de Criaturas si nunca parece disfrutarla.", "—Porque es la única clase donde nadie espera que hable.", "Amatis lo mira por encima de la hamburguesa. Y piensa que es la cosa más honesta que alguien le dijo en meses.", "Él contesta todo. Corto, seco, a veces con una frase tan torcida que ella tarda un segundo en darse cuenta de que es un chiste. Pero contesta. Y escucha. Escucha de una forma en que nadie la escucha en la sala común, donde todos hablan encima de todos, donde hay que gritar para existir. Greengrass escucha como si tuviera todo el tiempo del mundo. Como si cada palabra que ella dice fuera a quedarse guardada en algún lado.", "Y en algún momento, entre el segundo refresco y el último pedazo de hamburguesa, Amatis se da cuenta de algo.", "Las voces se callaron.", "No bajaron. No se alejaron. Se <em>callaron</em>. Hace cuánto no estaban, no lo sabe. No sabe cuándo se fueron. Pero ahí, en el fondo de ese bar asqueroso, con olor a grasa y a cerveza vieja, con una bufanda de Slytherin al cuello y un chico que casi no sonríe enfrente, la cabeza de Amatis está en silencio.", "Un silencio que no es vacío. Un silencio en el que se puede sentar. Un silencio en el que dan ganas de quedarse a escuchar por horas.", "Hace tanto que no lo tenía que casi no lo reconoce.", "> ✦", "No le pregunta por lo que pasó en el pasillo.", "Lo piensa varias veces durante la cena. Lo mira de reojo entre una historia y otra, buscando otra vez ese momento en que se le fueron los ojos. No vuelve a pasar. Él está ahí, presente, entero, contestando sus preguntas sobre pasadizos con la paciencia de alguien que ya sabe que no va a ganar.", "Pero ella no pregunta.", "Porque Amatis Castairs-Scamander sabe una cosa que aprendió de chiquita, al lado de su papá, acercándose a animales que no querían ser tocados: no se mete la mano en una herida que no te mostraron. Se espera. Se está cerca. Se deja que la criatura decida.", "Así que se queda cerca. Y espera.", "> ✦", "En la entrada del tapiz, en el tercer piso oscuro, le devuelve la bufanda. Le cuesta un poco soltarla.", "—Me debes un cómic. Digo, te debo un cómic. Te presto uno. Es lo mismo. —Se acomoda una oreja que no estaba torcida—. Buenas noches, Greengrass.", "—Buenas noches, Scamander.", "Se va por el pasillo sin voltear. No porque no quiera. Porque si voltea y él sigue ahí, mirándola, no sabe qué cara va a poner.", "La cola sigue moviéndose sola detrás de ella, de un lado a otro, más rápido que antes.", "Apenas en la escalera, bajando hacia el sótano, hacia el ruido que ya se escucha desde lejos, Amatis se da cuenta de que está sonriendo. Una sonrisa chiquita, tonta, que no le pidió permiso a nadie.", "Y de que, por primera vez en mucho tiempo, no tiene ganas de que la noche termine.", "Las voces van a volver. Ella lo sabe. Siempre vuelven.", "Pero esa noche, en algún rincón de su cabeza, quedó guardado un silencio verde y gris. Y Amatis tiene la sensación, absurda, peligrosa, imposible de explicar, de que va a querer volver a buscarlo."]}]}
];

const cv=$("fx"),g=cv.getContext("2d"),rn=Math.random;let W,H,P=[],R=[],mood="calm",mx=-999,my=-999,f=0,on=!matchMedia("(prefers-reduced-motion:reduce)").matches;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});
function mk(init){const t=mood=="calm"?0:mood=="sad"?1:2;return{t,x:rn()*W,y:init?rn()*H:(t==1?-10:t==2?H+10:rn()*H),vx:t==1?.3+rn()*.6:(rn()-.5)*.3,vy:t==1?.6+rn():t==2?-.3-rn()*.6:(rn()-.5)*.3,r:t==1?4+rn()*4:1+rn()*2,a:rn()*6,c:["#a5532a","#8a3a1e","#b0773a"][rn()*3|0]}}
function setMood(m){mood=m;P=[];for(let i=0;i<{calm:34,sad:20,dark:46}[m];i++)P.push(mk(1));R=[];if(m=="dark")for(let i=0;i<6;i++)R.push({p:[[W*i/5,H+4]],a:-Math.PI/2+(rn()-.5)*.6})}
addEventListener("pointerdown",e=>{if(!on||P.length>90)return;for(let i=0;i<6;i++){const p=mk(0);p.x=e.clientX;p.y=e.clientY;if(p.t!=1){p.vx=(rn()-.5)*2;p.vy=(rn()-.5)*2}P.push(p)}});
function loop(){requestAnimationFrame(loop);g.clearRect(0,0,W,H);if(!on)return;f++;
for(const p of P){const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy)||1;if(d<110){const k=(mood=="dark"?-1:1)*(110-d)/55;p.x+=dx/d*k;p.y+=dy/d*k}
p.x+=p.vx+(p.t==2?Math.sin(f*.02+p.a)*.6:0);p.y+=p.vy;if(p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)Object.assign(p,mk(0));
if(p.t==0){g.globalAlpha=.55+.45*Math.sin(f*.03+p.a);g.shadowColor="#e8e08a";g.shadowBlur=14;g.fillStyle="#f6efb0";g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}
else if(p.t==1){g.globalAlpha=.75;g.shadowBlur=0;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.a+f*.01);g.beginPath();g.ellipse(0,0,p.r,p.r*.5,0,0,6.3);g.fill();g.restore()}
else{g.globalAlpha=.45;g.shadowColor="#cfe8dc";g.shadowBlur=10;g.fillStyle="#d5ece0";g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}}
g.globalAlpha=1;g.shadowBlur=0;g.strokeStyle="rgba(12,18,12,.75)";g.lineWidth=2.5;
for(const r of R){const l=r.p[r.p.length-1];if(f%3==0&&r.p.length<90){r.a+=(rn()-.5)*.25;if(mx>0)r.a+=Math.sin(Math.atan2(my-l[1],mx-l[0])-r.a)*.03;r.p.push([l[0]+Math.cos(r.a)*5,l[1]+Math.sin(r.a)*5])}
g.beginPath();r.p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke()}}
setMood("calm");loop();

var shiftFn;function voices(c){removeEventListener("scroll",shiftFn);if(c.shifts){const T=c.shifts.map(s=>[...document.querySelectorAll(".sec p")].find(p=>p.textContent.startsWith(s.at)));shiftFn=()=>{let m=c.mood;T.forEach((t,i)=>{if(t&&t.getBoundingClientRect().top<innerHeight*.6)m=c.shifts[i].to});if(m!=mood){document.body.dataset.mood=m;setMood(m)}};addEventListener("scroll",shiftFn,{passive:true})}if(c.mood!="dark")return;document.querySelectorAll(".sec p:not(:has(em))").forEach(p=>{p.innerHTML=p.textContent.split(" ").map((w,k)=>k%23==11&&w.length>4?`<span class="voz">${w}</span>`:w).join(" ")})}
